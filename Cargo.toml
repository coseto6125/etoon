[package]
name = "etoon"
version = "0.7.1"
edition = "2021"
description = "Fast TOON (Token-Oriented Object Notation) encoder tracking spec v4.1. Up to 7.6x faster than toons, 3.0-8.3x faster than the official TS SDK."
license = "Apache-2.0"
repository = "https://github.com/coseto6125/etoon"
keywords = ["toon", "serialization", "llm", "json", "encoder"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"

[lib]
name = "_etoon"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "etoon"
path = "src/bin/etoon.rs"
required-features = []

# default is empty so `cargo install etoon` builds the CLI binary without
# pulling in pyo3; the Python wheel enables `python` explicitly via maturin
# (see pyproject.toml [tool.maturin] features).
[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
sonic-rs = { version = "0.5.8", default-features = false }
itoa = "1.0.18"
ryu = "1.0.20"
memchr = "2.7"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
